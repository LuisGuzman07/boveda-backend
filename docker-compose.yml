services:
  db:
    image: postgres:16-alpine
    container_name: boveda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boveda_db}
      POSTGRES_USER: ${POSTGRES_USER:-boveda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boveda_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boveda_user} -d ${POSTGRES_DB:-boveda_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boveda_backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-boveda_user}:${POSTGRES_PASSWORD:-boveda_password}@db:5432/${POSTGRES_DB:-boveda_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: boveda_postgres_data
